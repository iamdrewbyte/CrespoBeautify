<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrespoBeautify</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <div class="wordmark" aria-label="CrespoBeautify">Crespo<span>Beautify</span></div>
  <nav aria-label="Main"></nav>
</header>
<main>
  <section id="form-view" aria-labelledby="h-run">
    <div class="titlerow"><h1 id="h-run">Run QA</h1>
      <p class="muted">Upload one pair or a whole batch. Files are processed, offered for download, then deleted.</p></div>
    <div id="error" class="alert" role="alert" hidden></div>
    <form id="qa-form" novalidate>
      <div class="form-layout">
        <div class="box">
          <h2>Report details</h2>
          <div class="grid">
            <label>Default service
              <select id="service" name="service" required></select>
            </label>
            <label>Consultant full name
              <input id="consultant" name="consultant" type="text" maxlength="200" autocomplete="name" required>
            </label>
            <label>Reviewer full name <span class="opt">optional</span>
              <input name="reviewer" type="text" maxlength="200">
            </label>
            <label>Client name <span class="opt">optional</span>
              <input name="client" type="text" maxlength="200">
            </label>
            <label>Report date <span class="opt">optional</span>
              <input name="report_date" type="text" maxlength="200" placeholder="e.g. 9 October 2026">
            </label>
            <label>Engagement period <span class="opt">optional</span>
              <input name="period" type="text" maxlength="200">
            </label>
          </div>
        </div>
        <div class="box">
          <h2>Reports <span id="count" class="count"></span></h2>
          <div id="dz" class="dz" tabindex="0" role="button" aria-label="Choose or drop .docx reports">
            <strong>Drop reports here</strong><span class="hint">or click to browse. Several at once; Technical and Executive can be mixed.</span>
            <input type="file" id="files" accept=".docx" multiple tabindex="-1">
          </div>
          <div id="flist" class="flist" hidden></div>
          <label class="check" id="ai-wrap" hidden><input type="checkbox" id="ai_review"> AI review (local model): flags leftovers, mismatches and typos. It only flags; nothing is edited.</label>
          <label class="check"><input type="checkbox" name="dry_run" id="dry_run"> Dry run: show what would change, produce no files</label>
          <button id="submit" class="primary wide-btn" type="submit">Run QA</button>
        </div>
      </div>
    </form>
  </section>

  <section id="result-view" hidden aria-live="polite">
    <div class="tools">
      <h1 id="h-result">Processing</h1>
      <div id="saved" class="saved" hidden></div>
      <div class="actions">
        <div id="downloads" class="actions" hidden></div>
        <button id="again" class="ghost" type="button" hidden>Run another</button>
      </div>
    </div>
    <section id="why" class="box why" hidden aria-labelledby="h-why">
      <h2 id="h-why">What went wrong and why</h2>
      <div id="why-list"></div>
    </section>
    <div id="rgrid" class="rgrid">
      <div id="docs" class="docs"></div>
      <section id="review" class="box pane" hidden aria-labelledby="h-review">
        <h2 id="h-review">AI review</h2>
        <p id="review-progress" class="muted" role="status"></p>
        <div id="review-notes" class="muted"></div>
        <ul id="findings" class="findings"></ul>
      </section>
    </div>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
